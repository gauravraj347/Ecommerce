# Name shown in logs and (later) used by service discovery.
spring.application.name=product-service

# The port this service listens on. Matches the cloned product-service.
server.port=8086

# ---------------------------------------------------------------------------
# Database connection (PostgreSQL)
# The ${ENV_VAR:default} syntax means: use the environment variable if set,
# otherwise fall back to the default. This keeps secrets out of code later.
# ---------------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/productservice
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:admin}
spring.datasource.driver-class-name=org.postgresql.Driver

# ---------------------------------------------------------------------------
# JPA / Hibernate
#  - ddl-auto=update: Hibernate creates/updates tables from our @Entity classes.
#    (The clone used "validate", which needs tables to already exist. We use
#     "update" so the schema is built automatically while we learn.)
#  - show-sql + format_sql: print the SQL Hibernate runs, nicely formatted,
#    so you can SEE what is happening. Great for learning.
# ---------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
